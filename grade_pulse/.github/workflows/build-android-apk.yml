name: Build Grade Pulse Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Grade Pulse Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grade_pulse

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify this is the Grade Pulse project
        shell: bash
        run: |
          test -f pubspec.yaml || { echo "::error::pubspec.yaml not found inside grade_pulse/. Check the repository layout."; exit 1; }
          test -f lib/main.dart || { echo "::error::lib/main.dart not found inside grade_pulse/."; exit 1; }
          if grep -q "Flutter Demo Home Page" lib/main.dart; then
            echo "::error::The source is the default Flutter demo, not Grade Pulse. Stopping to avoid another wrong APK."
            exit 1
          fi
          echo "Found Grade Pulse Flutter source."

      - name: Generate Android platform files if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.gradepulse --project-name grade_pulse .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Grade-Pulse-Android-APK
          path: grade_pulse/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
