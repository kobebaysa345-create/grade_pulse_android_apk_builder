name: Build Grade Pulse Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The archive contains Flutter source but no generated Android platform files.
      - name: Generate Android platform files if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.gradepulse --project-name grade_pulse .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Grade-Pulse-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  quality-checks:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test
