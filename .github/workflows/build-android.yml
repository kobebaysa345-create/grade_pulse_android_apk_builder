name: Build Grade Pulse Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project location
        run: test -f grade_pulse_riverpod_refactor/pubspec.yaml

      - name: Generate Android files if missing
        working-directory: grade_pulse_riverpod_refactor
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Download project dependencies
        working-directory: grade_pulse_riverpod_refactor
        run: flutter pub get

      - name: Build release APK
        working-directory: grade_pulse_riverpod_refactor
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: grade-pulse-android-apk
          path: grade_pulse_riverpod_refactor/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
