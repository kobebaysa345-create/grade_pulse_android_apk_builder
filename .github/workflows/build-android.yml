name: Build and publish Grade Pulse Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile the actual Grade Pulse app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Grade Pulse source (not the Flutter starter app)
        shell: bash
        run: |
          set -euo pipefail
          test -f grade_pulse/pubspec.yaml
          grep -q '^name: grade_pulse$' grade_pulse/pubspec.yaml
          test -f grade_pulse/lib/main.dart
          test -f grade_pulse/lib/app.dart
          test -f grade_pulse/lib/views/main_shell_view.dart
          grep -q 'class GradePulseApp' grade_pulse/lib/app.dart
          grep -q 'class MainScreen' grade_pulse/lib/views/main_shell_view.dart
          test -f grade_pulse/assets/data/grade_pulse_data.json
          if grep -q 'Flutter Demo Home Page' grade_pulse/lib/main.dart; then
            echo "::error::Flutter starter template detected instead of Grade Pulse."
            exit 1
          fi
          echo "Verified the Grade Pulse application entry point, main screen, and bundled data."

      - name: Generate Android platform files if needed
        shell: bash
        run: |
          set -euo pipefail
          cd grade_pulse
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --project-name grade_pulse .
          fi
          test -f android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew

      - name: Download dependencies
        working-directory: grade_pulse
        run: flutter pub get

      - name: Build release APK
        working-directory: grade_pulse
        run: flutter build apk --release

      - name: Verify APK and give it a clear filename
        shell: bash
        run: |
          set -euo pipefail
          APK="grade_pulse/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" "grade_pulse/build/app/outputs/flutter-apk/Grade-Pulse.apk"
          ls -lh "grade_pulse/build/app/outputs/flutter-apk/Grade-Pulse.apk"

      - name: Store installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grade-Pulse-Android-APK
          path: grade_pulse/build/app/outputs/flutter-apk/Grade-Pulse.apk
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish APK under GitHub Releases
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Grade-Pulse-Android-APK
          path: dist

      - name: Publish installable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Grade Pulse Android Build #${{ github.run_number }}
          body: |
            Installable Android APK built from the Grade Pulse Flutter project in this repository.

            **Install on Android:** download `Grade-Pulse.apk`, open it on your phone, and approve installation from this source if Android asks.

            This is a directly installable testing build, not a Play Store production-signed release.
          files: dist/Grade-Pulse.apk
          make_latest: true
          fail_on_unmatched_files: true
